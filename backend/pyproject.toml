[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "jwcrypto>=1.6.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.0.55",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
